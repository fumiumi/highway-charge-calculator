[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kanto-highway-graph"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["osmium==4.3.1", "networkx==3.5", "geographiclib==2.1"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
